# 构建可安装的 debug APK：sync-upstream 推送新提交后自动触发（push 事件），
# 也可在 Actions 页面手动触发。README 链接更新的提交带 [skip ci]，不会循环。
# 原生产物（libnode / bash / rg / 三个 Rust .so）有缓存：生成脚本未变时直接复用，
# 跳过 NDK 下载与 Rust 编译，日常构建只需组装资源 + Gradle。
name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  # 连续推送只保留最新一次构建
  cancel-in-progress: true

env:
  # ubuntu runner 预装 Android SDK 的位置
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
  GRADLE_USER_HOME: ~/.gradle

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # 构建一开始即生成版本号并更新 README 下载链接（[skip ci] 不触发本流水线）：
      # 仓库 README 立刻指向即将发布的产物，消除「用户看到上一版链接」的窗口期。
      - name: 生成构建版本号并更新 README 下载链接
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-$(date -u +%Y%m%d-%H%M)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          python3 scripts/update-readme.py README.md "$TAG"
          git config user.name "dsh-build-bot"
          git config user.email "dsh-build-bot@users.noreply.github.com"
          git add README.md
          git commit -m "docs: APK 下载链接更新为 $TAG [skip ci]" || true
          git push || true

      # ⚠️ 手机版自有修复（2026-10-11 实测定位，移植验收循环失效的元凶）：
      # 上游机制是「`app/build.gradle` 的 versionCode 与 `NodeRunner.kt` 的
      # ASSET_VERSION **必须相等**」（`scripts/build-assets.py` 的
      # validate_asset_version 强制断言，防的正是「APK 更新后保留陈旧运行时资源」），
      # 且靠**发布时人为把这一对值一起 +1** 来触发新包解压 assets。
      # 而本仓库的自动构建从不递增它们（恒 65）⇒ 装任何新 APK，
      # `NodeRunner.ensureExtracted` 都判定 `files/dsh.version == ASSET_VERSION`
      # 而**跳过解压** ⇒ vendor 永远停留在旧版本（实测：装 0010/0023/0039 后
      # tree/ 下 dsh-providers-hub 的 mtime 始终不变，跑的一直是旧代码）。
      # ⇒ 构建时按「上游基线 versionCode + run_number」注入这一对值：
      #    单调递增（满足 Android 升级要求）、每次构建都不同（必然触发重解压）、
      #    两者相等（上游断言通过）。dsh-home 用户数据按既有逻辑完整保留。
      - name: 注入资源版本（versionCode 与 ASSET_VERSION 同步递增，强制新包解压 vendor）
        run: |
          BASE="$(grep -oE 'versionCode [0-9]+' app/build.gradle | head -1 | grep -oE '[0-9]+')"
          VCODE="$((BASE + ${{ github.run_number }}))"
          echo "注入资源版本: 基线 $BASE + run ${{ github.run_number }} = $VCODE"
          sed -i "s/versionCode [0-9]\+/versionCode $VCODE/" app/build.gradle
          sed -i "s/const val ASSET_VERSION = \"[^\"]*\"/const val ASSET_VERSION = \"$VCODE\"/" app/src/main/java/com/dshphone/NodeRunner.kt
          grep -n 'versionCode' app/build.gradle
          grep -n 'ASSET_VERSION' app/src/main/java/com/dshphone/NodeRunner.kt


      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'

      - name: 安装 pnpm
        run: npm install -g pnpm@10

      # 原生产物只随这些输入变化：node/bash/rg 准备脚本与包清单、
      # Rust 构建脚本（固定 noema commit）、flock/landlock 源码
      - name: 缓存原生产物（jniLibs）
        uses: actions/cache@v4
        id: jnilibs
        with:
          path: app/src/main/jniLibs/arm64-v8a
          key: jnilibs-${{ hashFiles('scripts/prepare-native.py', 'native/**', 'scripts/build-noema-android.py', 'scripts/build-flock-android.py', 'scripts/build-landlock-android.py', '.github/scripts/prepare-node-android.py') }}

      - name: 安装 Android SDK 组件
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 缓存 pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('runtime/pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - name: 缓存并安装 NDK r28c
        if: steps.jnilibs.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        id: ndk
        with:
          path: /usr/local/lib/android/sdk/ndk/28.2.13676358
          key: android-ndk-r28c

      - name: 安装 NDK r28c
        if: steps.jnilibs.outputs.cache-hit != 'true' && steps.ndk.outputs.cache-hit != 'true'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > /dev/null
          ls "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/"

      - name: 准备原生运行时（node / bash / ripgrep / Rust 三件套）
        if: steps.jnilibs.outputs.cache-hit != 'true'
        run: |
          python3 .github/scripts/prepare-node-android.py
          python3 scripts/prepare-native.py
          python3 scripts/build-noema-android.py
          python3 scripts/build-flock-android.py
          python3 scripts/build-landlock-android.py
          ls -l app/src/main/jniLibs/arm64-v8a/

      # vendored Jet Hub：源码 → lib（tsc）+ 客户端 bundle（esbuild）。
      # 移植改动直接住在 vendor/dsh-providers-hub/ 内，不再有外挂层。
      - name: 构建 vendored Jet Hub
        run: |
          cd vendor/dsh-providers-hub
          pnpm install --no-frozen-lockfile --ignore-scripts
          pnpm run build:all
          ls -l lib/index.js lib/client/jet-hub.js


      - name: 组装运行时资源
        run: |
          cd runtime
          # ⚠️ 用 --no-frozen-lockfile：包名从 dsh-codearts-auth 改为 dsh-providers-hub 后，
          #    lockfile 里的别名形态会让 pnpm 装出的目录名与期待不一致（CI 实测缺 dsh-providers-hub/）。
          #    这里让 pnpm 依 runtime/package.json 重算（workspace 内的 lock 由 CI 生成，不入库）。
          pnpm install --no-frozen-lockfile --ignore-scripts
          cd ..
          python3 scripts/build-assets.py
          ls -l app/src/main/assets/ | head
          # ⚠️⚠️ **部署侧硬门禁**（2026-10-17 事故固化，2026-10-30 随 OFM 退役改写）：
          #    build-assets.py 的 copy_bundle 用**共用 entries 白名单**决定打包内容，
          #    白名单漏一项时仓库侧断言全绿、tar 里却真的缺文件 ——
          #    build-20261016-1919 / -2013 两个发布的 dsh-tree.tar 都缺插件顶层 src/，
          #    装包后插件一加载就抛 Cannot find module、整体不挂载（用户看到「模型插件
          #    全没了」），而构建、类型检查、断言**全绿**，只有真机暴露。
          #    故这里**不查仓库、只查真正要装进 APK 的那个 tar**。
          #
          #    2026-10-30 起模型渠道宿主换成 dsh-providers-hub（客户端与宿主同一份包）：
          #    判据改为「凡打包了 dsh-providers-hub 的 tar，必须同时带 lib/index.js
          #    与 lib/client/jet-hub.js」—— 前者是宿主 RPC（聚合目录就靠它），
          #    后者是 Jet Hub 设置页/徽标；缺任何一个都只剩半身，页面会静默失效。
          # ⚠️⚠️ 2026-10-30 修正（上一版判据自相矛盾，CI 实测红）：
          #    dsh-providers-hub 是**profile bundle** —— 它随 dsh-home.tar 落在
          #    profiles/phone/node_modules/ 下，而 build-assets.py 组装后**刻意**把它从
          #    runtime 树里清掉（避免同一份插件在树里存两份、或被旧名副本解析到）。
          #    故「必须在场」只对 dsh-home.tar 成立；dsh-tree.tar 不带它属**预期**。
          #    实证：真机在跑的实例正是从 profiles/phone/node_modules/dsh-providers-hub
          #    解析到宿主与客户端的（tree/node_modules 下并无该目录）。
          #    判据仍是「文件齐不齐」：任一个 tar 只要带了 hub，就必须带全下面三件。
          for ENTRY in 'home app/src/main/assets/dsh-home.tar' 'tree app/src/main/assets/dsh-tree.tar'; do
            KIND=${ENTRY%% *}; TAR=${ENTRY#* }
            test -f "$TAR" || { echo "::error::找不到 $TAR —— 组装步骤未产出预期资源"; exit 1; }
            tar -tf "$TAR" > "$RUNNER_TEMP/tar-list.txt"
            if grep -q 'dsh-providers-hub/package\.json$' "$RUNNER_TEMP/tar-list.txt"; then
              MISSING=''
              # ⚠️ 判据用**后缀锚定**：两个 tar 的路径前缀不同
              #    （tree = node_modules/…；home = profiles/phone/node_modules/…），
              #    写死整行（grep -x）会恒不命中 —— 本门禁自己的反向验证抓过这个错。
              for NEEDED in 'lib/index.js' 'lib/client/jet-hub.js' 'locale/zh.json'; do
                grep -q "dsh-providers-hub/$NEEDED\$" "$RUNNER_TEMP/tar-list.txt" \
                  || MISSING="$MISSING dsh-providers-hub/$NEEDED"
              done
              if [ -n "$MISSING" ]; then
                echo "::error::$TAR 打包了 dsh-providers-hub 却缺运行时文件：$MISSING"
                echo "::error::根因通常是 copy_bundle 白名单漏项，或 vendor 没跑 build:all（lib/ 缺失）。"
                exit 1
              fi
              echo "  ✓ $TAR：Jet Hub 运行时齐备（lib/index.js / lib/client/jet-hub.js / locale/zh.json）"
            elif [ "$KIND" = home ]; then
              echo "::error::$TAR 未含 dsh-providers-hub —— 模型渠道宿主缺失，装包后 Jet Hub 与聚合目录全不可用"
              exit 1
            else
              echo "  ✓ $TAR：按设计不含 profile bundles（build-assets.py 组装后清理），跳过 hub 存在性判据"
            fi
          done

      - name: 编译 APK
        # `-I` 引入胶囊的 init script：把 debug 变体的 `android:debuggable` 关掉
        #（Issue F-01，见 `scripts/no-debuggable.gradle`）。
        # 用 init script 而不是覆盖上游 `app/build.gradle`，是为了不引入整份文件冻结
        # 带来的静默遮蔽风险（F-03 同源问题）。
        run: ./gradlew :app:clean :app:assembleDebug --no-daemon -I scripts/no-debuggable.gradle

      # ⚠️⚠️ **发布前的硬门禁**（Issue F-01）。上面那个 init script 是本仓库新增的
      # 机制，而本机没有 Android SDK、**无法在设备上验证它在真实 Gradle 里生效**。
      # 故这里不假设它一定生效，而是**直接检查产物**：只要 badging 里出现
      # `application-debuggable`，立即失败 —— 绝不让 debuggable 包被发出去。
      # 这正是本项目「防静默失效」的既定纪律：机制可以失效，但失效必须响亮。
      - name: 门禁：产物必须不是 debuggable
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          # ⚠️ `aapt` **不在 runner 的 PATH 上**（实测 2026-10-15：本步直接
          #    `aapt: command not found` / exit 127 ⇒ 门禁假红，产物其实没被判定）。
          #    SDK 把 aapt 放在 `$ANDROID_HOME/build-tools/<ver>/` 下，故用绝对路径定位；
          #    并兼容新版 build-tools 只随附 `aapt2`（其 `dump badging` 输出格式兼容）的情形。
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$AAPT" ] || [ ! -x "$AAPT" ]; then
            AAPT="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1 || true)"
          fi
          # 判据缺失 ≠ 通过：本门禁是发布前唯一防线，两个工具都找不到就按失败处理。
          if [ -z "$AAPT" ] || [ ! -x "$AAPT" ]; then
            echo "::error::找不到 aapt / aapt2（$ANDROID_HOME/build-tools/*/）—— debuggable 门禁无法判定，按失败处理。"
            ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null || true
            exit 1
          fi
          echo "门禁用工具：$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -E '^package:|^application-'
          # ⚠️ **判据必须自证可判定**（判据缺失 ≠ 通过，本项目既定纪律）：
          #    `aapt2 dump badging` 的输出格式与 `aapt` **未经验证完全一致**。若格式不同，
          #    下面的 `^application-debuggable` grep 会静默不命中 ⇒ **真 debuggable 包被放行**，
          #    而这是发布前唯一防线。故先要求输出确实是可判定的 badging：
          #      · 必须含 `package:` 行（证明它真解析了 APK）；
          #      · 必须至少有一行 `application-*`（证明 debuggable 之类标志会出现的位置存在）。
          #    任一不满足即硬失败 —— 宁可挡住发布，也不放过一个未判定的产物。
          if ! echo "$BADGING" | grep -q '^package:'; then
            echo "::error::badging 输出没有 `package:` 行 —— 该工具的 dump badging 格式与 aapt 不同，门禁无法判定，按失败处理。"
            echo "::error::请检查 $AAPT 的版本与子命令（本步依赖 aapt/aapt2 的 dump badging 兼容性）。"
            exit 1
          fi
          if ! echo "$BADGING" | grep -q '^application-'; then
            echo "::error::badging 输出没有任何 `application-*` 行 —— debuggable 标志的出现位置不存在，门禁无法判定，按失败处理。"
            exit 1
          fi
          if echo "$BADGING" | grep -q '^application-debuggable'; then
            echo "::error::发布产物是 debuggable 包（Issue F-01 回归）：run-as / adb pull 可读应用私有目录，WebView 远程调试可读页面内 Cookie（= 管理员凭据）。"
            echo "::error::请检查 -I scripts/no-debuggable.gradle 是否被 Gradle 接受（AGP 版本变更可能让 init script 失效）。"
            exit 1
          fi
          echo "✓ 产物非 debuggable"

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            --title "APK 构建 $TAG" \
            --notes "上游 main @ $(git rev-parse --short HEAD)" \
            --target main
          gh release upload "$TAG" app/build/outputs/apk/debug/app-debug.apk

      - name: 更新 README 下载链接
        run: |
          python3 scripts/update-readme.py README.md "$TAG"
          git config user.name "dsh-build-bot"
          git config user.email "dsh-build-bot@users.noreply.github.com"
          git add README.md
          # 幂等：内容无变化不提交（防循环），有变化才 push。
          git diff --cached --quiet || git commit -m "docs: 更新 APK 下载链接（$TAG） [skip ci]"
          # ⚠️ 非快进/竞态时不红：本步只是文档收尾，产物已发布（开头那步已推送过 README）。
          git push || { git pull --rebase --autostash || true; git push || true; }
