# 构建可安装的 debug APK：每次 sync-upstream 拉到更新后自动触发，也可手动触发
name: build-apk

on:
  workflow_run:
    workflows: [sync-upstream]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

env:
  # ubuntu runner 预装 Android SDK 的位置
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  # 仓库文档固定的 NDK r28c
  ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
  GRADLE_USER_HOME: ~/.gradle

jobs:
  build:
    # 手动触发总是构建；由 sync 触发时仅当 sync 成功才构建
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'

      - name: 安装 pnpm
        run: npm install -g pnpm@10

      - name: Rust 目标（Android arm64）
        run: |
          rustup update stable
          rustup target add aarch64-linux-android

      - name: 缓存 NDK r28c
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/28.2.13676358
          key: android-ndk-r28c

      - name: 安装 Android SDK 组件
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platform-tools" "platforms;android-36" \
            "build-tools;36.0.0" "ndk;28.2.13676358" > /dev/null
          ls "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/"

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 缓存 pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('runtime/pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - name: 准备 arm64 Node 运行时（Termux 官方包 -> libnode.so）
        run: python3 .github/scripts/prepare-node-android.py

      - name: 准备 Bash / ripgrep 原生库
        run: python3 scripts/prepare-native.py

      - name: 编译 Noema / flock / landlock（Rust + NDK）
        run: |
          python3 scripts/build-noema-android.py
          python3 scripts/build-flock-android.py
          python3 scripts/build-landlock-android.py
          ls -l app/src/main/jniLibs/arm64-v8a/

      - name: 组装运行时资源
        run: |
          cd runtime
          pnpm install --frozen-lockfile --ignore-scripts
          cd ..
          python3 scripts/build-assets.py
          ls -l app/src/main/assets/ | head

      - name: 编译 APK
        run: ./gradlew :app:clean :app:assembleDebug --no-daemon
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-$(date -u +%Y%m%d-%H%M)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          gh release create "$TAG" \
            --title "APK 构建 $TAG" \
            --notes "上游 main @ $(git rev-parse --short HEAD)" \
            --target main
          gh release upload "$TAG" app/build/outputs/apk/debug/app-debug.apk

      - name: 更新 README 下载链接
        run: |
          python3 .github/scripts/apk-link.py README.md "$TAG"
          git config user.name "dsh-build-bot"
          git config user.email "dsh-build-bot@users.noreply.github.com"
          git add README.md
          git commit -m "docs: 更新 APK 下载链接（$TAG） [skip ci]"
          git push
