# ⚠️ port-gitee 测试分支专用：只做类型检查级验证（vitest + tsc + esbuild），
# 跳过 APK 打包 / Release / README 更新 —— 移植轮次的快速反馈环。
# main 的完整构建模板在 .github/capsule/build-apk.yml（sync 后由 sync-upstream 恢复）。
# 合并回 main 时：不带本文件，或恢复完整版 workflow。
name: build-apk (port-gitee typecheck only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 「在用模型」胶囊外挂：把 .github/capsule/ 的文件复制/覆盖到工作区。
      # 自检项缺失会显式失败（保证「胶囊失效」永远可见）。
      - name: 应用胶囊外挂（Active Model Pill）
        run: bash .github/capsule/apply.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'

      - name: 安装 pnpm
        run: npm install -g pnpm@10

      - name: 缓存 pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('runtime/pnpm-lock.yaml') }}
          restore-keys: pnpm-

      # 接线后的 vendor 源码验证：vitest 胶囊 spec → tsc 类型检查 → esbuild 重建
      # bundle。移植代码的类型错误在这里显式失败（上游自己从不跑 tsc）。
      - name: vendor 验证（vitest + tsc + esbuild）
        run: bash .github/capsule/rebuild-vendor.sh
