# 手动把上游 jwoo1982217-eng/dsh-phone 合并到本仓库 main（2026-10-11 起已停止每日自动同步）
name: sync-upstream

# ⚠️ 2026-10-11 用户要求：**停止每天自动拉取上游**。
#    已移除下面原有的 `schedule` 触发器（曾是北京时间每天 07:30）——本 workflow 现在
#    **只能手动**（workflow_dispatch）运行。起因：移植分支 port-gitee 已验收并合并回
#    main，main 不再跟随上游 jwoo1982217-eng/dsh-phone；保留本文件与其合并逻辑，
#    是为了需要时能一次性手动补一次。要恢复每日同步：把 `schedule` 段加回即可。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 git 身份
        run: |
          git config user.name "dsh-sync-bot"
          git config user.email "dsh-sync-bot@users.noreply.github.com"

      - name: 拉取上游并合并
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/jwoo1982217-eng/dsh-phone.git
          git fetch upstream main
          BEHIND=$(git rev-list --count main..upstream/main)
          echo "上游领先本仓库：$BEHIND 个提交"
          if [ "$BEHIND" -eq 0 ]; then
            echo "上游无更新，本次跳过"
            exit 0
          fi
          git log --oneline main..upstream/main | head -30

          if git merge upstream/main --no-edit; then
            git push origin main
            # 上游同步会覆盖本地修改的 .github/workflows/build-apk.yml：
            # 从 capsule 模板恢复 + 重新应用外挂（apply.sh 幂等），[skip ci] 提交。
            cp .github/capsule/build-apk.yml .github/workflows/build-apk.yml
            bash .github/capsule/apply.sh
            git add .github/workflows/build-apk.yml
            git commit -m "chore: 恢复胶囊外挂配置 [skip ci]" || true
            git push || true
            # 同步后立即触发一次构建，避免下次定时构建前 APK 落后上游。
            gh workflow run build-apk.yml
            exit 0
          fi

          # 合并冲突兜底（2026-10-17 重写）。两类**已知**冲突可自动处理，其余一律中止。
          #
          # ① README.md：⚠️ **保留我方**（`--ours`），只刷新自动生成的下载区块。
          #    实测依据：我方 README 是**精编版**（3.5 KB：这是什么 / 快速开始 /
          #    深入了解 / 致谢与上游项目），而上游的是长文档（22 KB）——
          #    原实现 `--theirs` 会把我方那 47 行独有内容整份换掉（静默丢文档）。
          #    下载区块由 `.github/scripts/apk-link.py` 维护，本就该自动重建。
          #    若哪天要改为采纳上游文档，把这里的 `--ours` 换成 `--theirs` 即可。
          # ② `vendor/dsh-codearts-auth/**` 的 **modify/delete**：本仓库在 `a586fdb6`
          #    里**有意删除**了 6 个「已被 rc.11 淘汰的孤儿模块」，而上游那条线仍在改它们。
          #    功能已由 capsule 的 `src/zcode-entitlements.ts` 承接（apply.sh §4 有断言）
          #    ⇒ 这类冲突**保留删除**。⚠️ 白名单只到该前缀，且逐个核对「在本仓库 HEAD 里
          #    确实不存在」，不满足即中止（不猜）。
          CONFLICTS=$(git diff --name-only --diff-filter=U || true)
          echo "冲突文件："
          echo "$CONFLICTS" | sed 's/^/  - /'
          OTHER=$(echo "$CONFLICTS" | grep -v '^README\.md$' | grep -v '^vendor/dsh-codearts-auth/' || true)
          if [ -n "$OTHER" ]; then
            git merge --abort || true
            echo "::error::与上游存在**未知类**冲突，需人工处理（不自动猜）："
            echo "$OTHER"
            exit 1
          fi

          if echo "$CONFLICTS" | grep -q '^README\.md$'; then
            echo "  README.md：保留我方版本，只刷新下载区块"
            git checkout --ours README.md
            TAG=$(gh api repos/zhaolongwudi/dsh-phone/releases/latest --jq .tag_name 2>/dev/null || true)
            python3 .github/scripts/apk-link.py README.md "$TAG"
            git add README.md
          fi

          for f in $(echo "$CONFLICTS" | grep '^vendor/dsh-codearts-auth/' || true); do
            if git cat-file -e "HEAD:$f" 2>/dev/null; then
              git merge --abort || true
              echo "::error::$f 在本仓库 HEAD 里仍存在 —— 不属于「已删除的孤儿模块」，拒绝自动解决"
              exit 1
            fi
            echo "  保留删除（孤儿模块，功能已由 capsule 的 zcode-entitlements.ts 承接）：$f"
            git rm -q --ignore-unmatch "$f"
          done

          # 与成功路径同样的收尾：恢复胶囊 workflow + 跑一遍 apply.sh（顺带验证
          # 合并后胶囊的锚点仍然成立），然后提交、推送、触发构建。
          cp .github/capsule/build-apk.yml .github/workflows/build-apk.yml
          bash .github/capsule/apply.sh
          git add .github/workflows/build-apk.yml
          git commit --no-edit
          git push origin main
          gh workflow run build-apk.yml
