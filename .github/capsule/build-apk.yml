# 构建可安装的 debug APK：sync-upstream 推送新提交后自动触发（push 事件），
# 也可在 Actions 页面手动触发。README 链接更新的提交带 [skip ci]，不会循环。
# 原生产物（libnode / bash / rg / 三个 Rust .so）有缓存：生成脚本未变时直接复用，
# 跳过 NDK 下载与 Rust 编译，日常构建只需组装资源 + Gradle。
name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  # 连续推送只保留最新一次构建
  cancel-in-progress: true

env:
  # ubuntu runner 预装 Android SDK 的位置
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
  GRADLE_USER_HOME: ~/.gradle

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # 构建一开始即生成版本号并更新 README 下载链接（[skip ci] 不触发本流水线）：
      # 仓库 README 立刻指向即将发布的产物，消除「用户看到上一版链接」的窗口期。
      - name: 生成构建版本号并更新 README 下载链接
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-$(date -u +%Y%m%d-%H%M)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          python3 .github/capsule/update-readme.py README.md "$TAG"
          git config user.name "dsh-build-bot"
          git config user.email "dsh-build-bot@users.noreply.github.com"
          git add README.md
          git commit -m "docs: APK 下载链接更新为 $TAG [skip ci]" || true
          git push || true

      # ⚠️ 手机版自有修复（2026-10-11 实测定位，移植验收循环失效的元凶）：
      # 上游机制是「`app/build.gradle` 的 versionCode 与 `NodeRunner.kt` 的
      # ASSET_VERSION **必须相等**」（`scripts/build-assets.py` 的
      # validate_asset_version 强制断言，防的正是「APK 更新后保留陈旧运行时资源」），
      # 且靠**发布时人为把这一对值一起 +1** 来触发新包解压 assets。
      # 而本仓库的自动构建从不递增它们（恒 65）⇒ 装任何新 APK，
      # `NodeRunner.ensureExtracted` 都判定 `files/dsh.version == ASSET_VERSION`
      # 而**跳过解压** ⇒ vendor 永远停留在旧版本（实测：装 0010/0023/0039 后
      # tree/ 下 dsh-codearts-auth 的 mtime 始终不变，跑的一直是旧代码）。
      # ⇒ 构建时按「上游基线 versionCode + run_number」注入这一对值：
      #    单调递增（满足 Android 升级要求）、每次构建都不同（必然触发重解压）、
      #    两者相等（上游断言通过）。dsh-home 用户数据按既有逻辑完整保留。
      - name: 注入资源版本（versionCode 与 ASSET_VERSION 同步递增，强制新包解压 vendor）
        run: |
          BASE="$(grep -oE 'versionCode [0-9]+' app/build.gradle | head -1 | grep -oE '[0-9]+')"
          VCODE="$((BASE + ${{ github.run_number }}))"
          echo "注入资源版本: 基线 $BASE + run ${{ github.run_number }} = $VCODE"
          sed -i "s/versionCode [0-9]\+/versionCode $VCODE/" app/build.gradle
          sed -i "s/const val ASSET_VERSION = \"[^\"]*\"/const val ASSET_VERSION = \"$VCODE\"/" app/src/main/java/com/dshphone/NodeRunner.kt
          grep -n 'versionCode' app/build.gradle
          grep -n 'ASSET_VERSION' app/src/main/java/com/dshphone/NodeRunner.kt

      # 「在用模型」胶囊外挂：把 .github/capsule/ 的文件复制/覆盖到工作区，
      # 随 APK 打包后丢弃。git 仓库内容不变，sync 合并永不冲突。
      - name: 应用胶囊外挂（Active Model Pill）
        run: bash .github/capsule/apply.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'

      - name: 安装 pnpm
        run: npm install -g pnpm@10

      # 原生产物只随这些输入变化：node/bash/rg 准备脚本与包清单、
      # Rust 构建脚本（固定 noema commit）、flock/landlock 源码
      - name: 缓存原生产物（jniLibs）
        uses: actions/cache@v4
        id: jnilibs
        with:
          path: app/src/main/jniLibs/arm64-v8a
          key: jnilibs-${{ hashFiles('scripts/prepare-native.py', 'native/**', 'scripts/build-noema-android.py', 'scripts/build-flock-android.py', 'scripts/build-landlock-android.py', '.github/scripts/prepare-node-android.py') }}

      - name: 安装 Android SDK 组件
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 缓存 pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('runtime/pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - name: 缓存并安装 NDK r28c
        if: steps.jnilibs.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        id: ndk
        with:
          path: /usr/local/lib/android/sdk/ndk/28.2.13676358
          key: android-ndk-r28c

      - name: 安装 NDK r28c
        if: steps.jnilibs.outputs.cache-hit != 'true' && steps.ndk.outputs.cache-hit != 'true'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > /dev/null
          ls "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/"

      - name: 准备原生运行时（node / bash / ripgrep / Rust 三件套）
        if: steps.jnilibs.outputs.cache-hit != 'true'
        run: |
          python3 .github/scripts/prepare-node-android.py
          python3 scripts/prepare-native.py
          python3 scripts/build-noema-android.py
          python3 scripts/build-flock-android.py
          python3 scripts/build-landlock-android.py
          ls -l app/src/main/jniLibs/arm64-v8a/

      # 接线后的 vendor 源码重新编译（lib/ 全是编译产物）：tsc 做类型检查，
      # esbuild 重建面板 bundle；胶囊接线错误在这里显式失败。
      # 纯净构建（.github/capsule/DISABLED 存在）时跳过重建，直接用仓库预编译 lib。
      - name: 编译 vendor 插件（胶囊接线重建 lib）
        run: bash .github/capsule/rebuild-vendor.sh

      - name: 组装运行时资源
        run: |
          cd runtime
          pnpm install --frozen-lockfile --ignore-scripts
          cd ..
          python3 scripts/build-assets.py
          ls -l app/src/main/assets/ | head

      - name: 编译 APK
        # `-I` 引入胶囊的 init script：把 debug 变体的 `android:debuggable` 关掉
        #（Issue F-01，见 `.github/capsule/files/scripts/no-debuggable.gradle`）。
        # 用 init script 而不是覆盖上游 `app/build.gradle`，是为了不引入整份文件冻结
        # 带来的静默遮蔽风险（F-03 同源问题）。
        run: ./gradlew :app:clean :app:assembleDebug --no-daemon -I .github/capsule/files/scripts/no-debuggable.gradle

      # ⚠️⚠️ **发布前的硬门禁**（Issue F-01）。上面那个 init script 是本仓库新增的
      # 机制，而本机没有 Android SDK、**无法在设备上验证它在真实 Gradle 里生效**。
      # 故这里不假设它一定生效，而是**直接检查产物**：只要 badging 里出现
      # `application-debuggable`，立即失败 —— 绝不让 debuggable 包被发出去。
      # 这正是本项目「防静默失效」的既定纪律：机制可以失效，但失效必须响亮。
      - name: 门禁：产物必须不是 debuggable
        run: |
          BADGING=$(aapt dump badging app/build/outputs/apk/debug/app-debug.apk)
          echo "$BADGING" | grep -E '^package:|^application-'
          if echo "$BADGING" | grep -q '^application-debuggable'; then
            echo "::error::发布产物是 debuggable 包（Issue F-01 回归）：run-as / adb pull 可读应用私有目录，WebView 远程调试可读页面内 Cookie（= 管理员凭据）。"
            echo "::error::请检查 -I .github/capsule/files/scripts/no-debuggable.gradle 是否被 Gradle 接受（AGP 版本变更可能让 init script 失效）。"
            exit 1
          fi
          echo "✓ 产物非 debuggable"

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            --title "APK 构建 $TAG" \
            --notes "上游 main @ $(git rev-parse --short HEAD)" \
            --target main
          gh release upload "$TAG" app/build/outputs/apk/debug/app-debug.apk

      - name: 更新 README 下载链接
        run: |
          python3 .github/capsule/update-readme.py README.md "$TAG"
          git config user.name "dsh-build-bot"
          git config user.email "dsh-build-bot@users.noreply.github.com"
          git add README.md
          # 幂等：内容无变化不提交（防循环），有变化才 push。
          git diff --cached --quiet || git commit -m "docs: 更新 APK 下载链接（$TAG） [skip ci]"
          git push
